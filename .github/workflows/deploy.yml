name: Deploy SalesTrack to Live Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy to Live FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Secrets Configuration
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ] || [ -z "${{ secrets.FTP_USERNAME }}" ] || [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "❌ ERROR: GitHub Secrets not configured!"
            echo "Please add the following secrets in Settings > Secrets and variables > Actions:"
            echo "  - FTP_SERVER: your InfinityFree FTP host"
            echo "  - FTP_USERNAME: your InfinityFree FTP username"
            echo "  - FTP_PASSWORD: your InfinityFree FTP password"
            exit 1
          fi
          echo "✅ All required secrets are configured"

      - name: Display Deployment Information
        run: |
          echo "📦 Deployment Summary:"
          echo "  Server: ${{ secrets.FTP_SERVER }}"
          echo "  Username: ${{ secrets.FTP_USERNAME }}"
          echo "  Target Path: /htdocs/"
          echo "  Commit: ${{ github.sha }}"
          echo "  Branch: ${{ github.ref }}"

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          local-dir: ./
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false

      - name: Deployment Complete
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🌐 Your site should update within seconds:"
          echo "   https://salestrack.infinityfreeapp.com"

